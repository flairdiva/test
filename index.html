<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>test</title>
<meta name="portfolio-studio-format" content="1">
<style>
                *{box-sizing:border-box}body{margin:0;padding:24px;background:#fffafa;color:#4a4a4a;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
                inline-emoji{display:inline-block;width:1.2em;height:1.2em;vertical-align:-.2em;line-height:1}inline-emoji img{display:block;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none;user-select:none}
                .portfolio-page{--p-accent:#ff85a2;--p-soft:#ffe4e9;max-width:740px;margin:auto}
                .portfolio-card{--card-padding:32px;margin:0 auto 18px;padding:var(--card-padding);overflow:hidden;border-radius:26px;background:#fff;text-align:center;box-shadow:0 12px 30px color-mix(in srgb,var(--p-accent) 15%,transparent)}
                .portfolio-banner{position:relative;height:230px;margin:calc(-1 * var(--card-padding)) calc(-1 * var(--card-padding)) -75px;overflow:hidden}.portfolio-banner img{display:block;width:100%;height:100%;object-fit:cover;object-position:center var(--banner-position,45%);-webkit-user-drag:none;user-select:none}.portfolio-banner:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(to bottom,transparent,#fff);pointer-events:none}
                .portfolio-page h1,.portfolio-page h2{color:var(--p-accent)}.portfolio-page h1{font-size:2.2rem;margin:14px 0 5px}
                .portfolio-photos{position:relative;display:flex;justify-content:center;align-items:center;gap:8px;min-height:120px}.portfolio-photos.align-left{justify-content:flex-start}.portfolio-photos.align-right{justify-content:flex-end}
                .portfolio-photos img{width:100px;height:100px;border-radius:50%;object-fit:cover;border:4px solid white;box-shadow:0 3px 12px #3333}
                .portfolio-photos.carousel{display:block;width:min(390px,100%);min-height:0;aspect-ratio:3/1;margin:auto;overflow:hidden;touch-action:pan-y;user-select:none}.portfolio-photos.carousel img{position:absolute;top:0;width:33.3333%;height:100%;aspect-ratio:1;border:0;border-radius:50%;object-fit:cover;cursor:grab;-webkit-user-drag:none}.portfolio-photos.carousel .pfp-left{left:0;opacity:.5;transform:scale(.75)}.portfolio-photos.carousel .pfp-center{left:33.3333%;opacity:1;transform:scale(1);z-index:2}.portfolio-photos.carousel .pfp-right{left:66.6667%;opacity:.5;transform:scale(.75)}.portfolio-photos.carousel .pfp-incoming{display:none;left:0;pointer-events:none}.portfolio-photos.carousel .pfp-enter-from-left{left:0}.portfolio-photos.carousel .pfp-enter-from-right{left:66.6667%}.portfolio-photos.carousel.is-animating .pfp-incoming{display:block}
                .portfolio-status{color:#8f6c77;margin:0 0 14px}
                .portfolio-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:18px 0}.portfolio-stat{position:relative;padding:10px;border-radius:10px;background:var(--p-soft);font-weight:650;font-size:.92rem;cursor:default}.portfolio-stat:last-child:nth-child(odd){grid-column:1/-1}
                .portfolio-stat[data-hint]{cursor:help}.portfolio-stat[data-hint]:hover:after,.portfolio-stat[data-hint]:focus-visible:after{content:attr(data-hint);position:absolute;z-index:5;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);padding:6px 12px;border-radius:8px;background:#4a4a4a;color:white;font-size:.78rem;font-weight:400;white-space:nowrap;box-shadow:0 3px 10px #0002}
                .portfolio-badges{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}.portfolio-badges img{width:32px;height:32px;object-fit:contain}
                .portfolio-bio{padding:16px;border-left:4px solid var(--p-accent);border-radius:8px;background:#fffcfc;text-align:left;white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere}
                .portfolio-socials{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px}.portfolio-socials a,.portfolio-button{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:24px;background:var(--p-accent);color:#fff;text-decoration:none;font-weight:bold}
                .portfolio-socials img{width:22px;height:22px;object-fit:contain}.portfolio-section{margin:0 auto 18px;padding:28px;border-radius:22px;background:#fff;box-shadow:0 10px 25px #32101a0c}
                .portfolio-section h2{font-size:1.25rem;border-bottom:2px solid var(--p-soft);padding-bottom:8px}.portfolio-time{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:16px;padding:8px 12px;border:1px solid var(--p-soft);border-radius:20px;background:#fffcfc}.portfolio-time-info{text-align:left}.portfolio-time-info h3{margin:0;color:var(--p-accent);font-size:1.2rem}.portfolio-time-zone{color:#9c7783;font-size:.8rem}
                .hybrid-clock{position:relative;flex:0 0 70px;width:70px;height:70px;border:2px solid var(--p-soft);border-radius:50%;background:#fff;box-shadow:0 4px 10px color-mix(in srgb,var(--p-accent) 9%,transparent)}.hybrid-hand{position:absolute;top:50%;height:2px;border-radius:2px;transform-origin:100%}.h-hour{left:25%;width:25%;height:3px;background:var(--p-ink)}.h-min{left:15%;width:35%;background:#888}.h-sec{left:12%;width:38%;height:1px;background:var(--p-accent)}.hybrid-digital{position:absolute;z-index:3;top:40%;left:50%;transform:translateX(-50%);padding:2px 4px;border-radius:4px;background:#fffdfddd;color:var(--p-ink);font:bold .75rem monospace}
                .portfolio-interest-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.portfolio-interest{aspect-ratio:2/3;min-height:130px;display:flex;flex-direction:column;justify-content:end;padding:10px;color:#fff;border-radius:12px;background:linear-gradient(160deg,var(--p-soft),var(--p-accent));background-position:center;background-size:cover;text-shadow:0 1px 5px #000b}
                .portfolio-interest small{margin-top:4px}.portfolio-extra{line-height:1.6;overflow-wrap:anywhere}.portfolio-extra img{display:block;max-width:100%;max-height:300px;object-fit:cover;border-radius:12px;margin:12px auto}
                @media(max-width:520px){body{padding:12px}.portfolio-card{--card-padding:22px;padding:var(--card-padding)}.portfolio-section{padding:22px}.portfolio-banner{height:auto;aspect-ratio:2.3/1}.portfolio-stats{grid-template-columns:1fr}}
            </style>
</head>

                            restore();
                            assign(slots[3], current + 2);
                            animations.forEach((animation) => animation.cancel());
                        }).catch((error) => {
                            animations.forEach((animation) => animation.cancel());
                            restore();
                            console.error("Unable to animate the profile picture carousel.", error);
                        });
                    };
                    let pointerStart = null;
                    photos.tabIndex = 0;
                    photos.addEventListener("wheel", (event) => {
                        event.preventDefault();
                        rotate(Math.sign(event.deltaY));
                    }, { passive: false });
                    photos.addEventListener("pointerdown", (event) => {
                        if (event.pointerType === "touch" || event.pointerType === "pen") pointerStart = event.clientX;
                    });
                    photos.addEventListener("pointerup", (event) => {
                        if (pointerStart === null) return;
                        const delta = event.clientX - pointerStart;
                        if (Math.abs(delta) > 24) rotate(delta < 0 ? 1 : -1);
                        pointerStart = null;
                    });
                    photos.addEventListener("keydown", (event) => {
                        if (event.key === "ArrowRight") rotate(1);
                        if (event.key === "ArrowLeft") rotate(-1);
                    });
                }

                for (const clock of root.querySelectorAll("[data-clock]")) {
                    const zone = clock.dataset.clock;
                    const digital = clock.querySelector(".hybrid-digital");
                    const display = root.querySelector("[data-timezone]");
                    const update = () => {
                        try {
                            const parts = new Intl.DateTimeFormat("en-GB", { timeZone: zone, hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" }).formatToParts(new Date());
                            const values = Object.fromEntries(parts.map((part) => [part.type, part.value]));
                            const hourText = String(values.hour).padStart(2, "0");
                            const hour = Number(values.hour), minute = Number(values.minute), second = Number(values.second);
                            if (display) display.textContent = `${hourText}:${values.minute}`;
                            if (digital) digital.textContent = `${hourText}:${values.minute}`;
                            clock.querySelector(".h-hour").style.transform = `rotate(${hour % 12 * 30 + minute * .5 - 90}deg)`;
                            clock.querySelector(".h-min").style.transform = `rotate(${minute * 6 - 90}deg)`;
                            clock.querySelector(".h-sec").style.transform = `rotate(${second * 6 - 90}deg)`;
                        } catch (error) {
                            if (!(error instanceof RangeError)) throw error;
                            if (display) display.textContent = "Invalid timezone";
                        }
                    };
                    update();
                    setInterval(update, 1000);
                }
            })();
</script>
</body>
